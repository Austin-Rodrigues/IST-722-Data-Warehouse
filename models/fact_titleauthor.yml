version: 2

models:
  - name: fact_titleauthor
    description: Fact model mapping authors to titles and their royalty contributions.
    columns:
      - name: au_id
        description: Author ID.
      - name: title_id
        description: Title ID.
      - name: au_ord
        description: Order of authorship.
      - name: royaltyper
        description: Royalty percentage for the author.
      - name: authorkey
        description: Surrogate key for author.
      - name: titlekey
        description: Surrogate key for title.

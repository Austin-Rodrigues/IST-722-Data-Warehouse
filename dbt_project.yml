name: 'pubs'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  pubs:
    +materialized: table
    database: PUBS           # This is your Snowflake database
    +schema: ANALYTICS       # This is where dbt will create models

